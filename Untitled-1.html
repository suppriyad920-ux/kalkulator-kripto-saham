<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Risk Calculator & Journal - Rafliansyah</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #151c28;
      --card-border: #232d3f;
      --input-bg: #1c2536;
      --input-border: #2e3a50;
      --accent: #3b82f6;
      --green-profit: #10b981;
      --red-loss: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
    }

    .app-layout {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .app-layout { grid-template-columns: 450px 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .author-tag { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
    h2 { font-size: 1.3rem; font-weight: 600; color: var(--text-main); }

    .type-switcher {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: var(--input-bg); padding: 4px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--card-border);
    }

    .type-btn {
      padding: 8px; border: none; border-radius: 8px; background: transparent;
      color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .type-btn.active-buy { background: var(--green-profit); color: #fff; }
    .type-btn.active-sell { background: var(--red-loss); color: #fff; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }

    input, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; padding: 10px 12px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .results-box {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--card-border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }

    .res-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; text-align: center; }
    .res-card.full-width { grid-column: span 2; }
    .res-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .res-val { font-size: 1.15rem; font-weight: 600; margin-top: 3px; }
    .val-accent { color: var(--accent); }
    .val-green { color: var(--green-profit); }
    .val-red { color: var(--red-loss); }

    .btn-action {
      width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 10px;
      font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s;
    }
    .btn-save { background: var(--accent); color: #fff; }
    .btn-save:hover { background: #2563eb; }

    /* Area Tabel Jurnal */
    .journal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-csv { background: rgba(16, 185, 129, 0.15); color: var(--green-profit); border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-csv:hover { background: var(--green-profit); color: #fff; }

    .table-wrapper { overflow-x: auto; max-height: 420px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--card-border); }
    th { color: var(--text-muted); font-weight: 500; position: sticky; top: 0; background: var(--card-bg); }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Panel Calculator -->
    <div class="card">
      <div class="header">
        <div class="author-tag">Rafliansyah</div>
        <h2>Risk Calculator</h2>
      </div>

      <div class="type-switcher">
        <button class="type-btn active-buy" id="btnBuy" onclick="setDirection('BUY')">BUY</button>
        <button class="type-btn" id="btnSell" onclick="setDirection('SELL')">SELL</button>
      </div>

      <div class="form-group">
        <label>Aset / Instrumen</label>
        <select id="asset" onchange="adjustContractSize()">
          <option value="100">XAUUSD (Gold)</option>
          <option value="20">US100 (Nasdaq)</option>
          <option value="100000">EURUSD (Forex)</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Modal ($)</label>
          <input type="number" id="balance" value="1000" oninput="calculateRisk()">
        </div>
        <div class="form-group">
          <label>Risiko (%)</label>
          <input type="number" id="riskPercent" value="1" step="0.1" oninput="calculateRisk()">
        </div>
      </div>

      <div class="form-group">
        <label>Harga Entry</label>
        <input type="number" id="entry" value="2650.00" step="any" oninput="calculateRisk()">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Stop Loss (SL)</label>
          <input type="number" id="sl" value="2645.00" step="any" oninput="calculateRisk()">
        </div>
        <div class="form-group">
          <label>Take Profit (TP)</label>
          <input type="number" id="tp" value="2665.00" step="any" oninput="calculateRisk()">
        </div>
      </div>

      <div class="results-box">
        <div class="res-card full-width">
          <div class="res-label">Ukuran Lot</div>
          <div class="res-val val-accent" id="resLot">0.00 Lot</div>
        </div>
        <div class="res-card">
          <div class="res-label">Risiko</div>
          <div class="res-val val-red" id="resRiskUSD">-$0.00</div>
        </div>
        <div class="res-card">
          <div class="res-label">Reward</div>
          <div class="res-val val-green" id="resRewardUSD">+$0.00</div>
        </div>
      </div>

      <button class="btn-action btn-save" onclick="saveToJournal()">Simpan ke Jurnal</button>
    </div>

    <!-- Panel Jurnal Trading -->
    <div class="card">
      <div class="journal-header">
        <h2>Jurnal Trading Plan</h2>
        <button class="btn-csv" onclick="exportCSV()">Ekspor CSV</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Posisi</th>
              <th>Entry</th>
              <th>SL / TP</th>
              <th>Lot</th>
              <th>Risk/Reward</th>
            </tr>
          </thead>
          <tbody id="journalBody">
            <!-- Data histori jurnal dimasukkan lewat JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentDirection = 'BUY';
    let journalData = [];

    function setDirection(dir) {
      currentDirection = dir;
      document.getElementById('btnBuy').className = dir === 'BUY' ? 'type-btn active-buy' : 'type-btn';
      document.getElementById('btnSell').className = dir === 'SELL' ? 'type-btn active-sell' : 'type-btn';
      calculateRisk();
    }

    function calculateRisk() {
      const balance = parseFloat(document.getElementById('balance').value) || 0;
      const riskPercent = parseFloat(document.getElementById('riskPercent').value) || 0;
      const entry = parseFloat(document.getElementById('entry').value) || 0;
      const sl = parseFloat(document.getElementById('sl').value) || 0;
      const tp = parseFloat(document.getElementById('tp').value) || 0;
      const contractSize = parseFloat(document.getElementById('asset').value);

      const riskAmountUSD = balance * (riskPercent / 100);
      const slDistance = Math.abs(entry - sl);
      const tpDistance = Math.abs(entry - tp);

      if (slDistance === 0) return { lotSize: 0, riskAmountUSD: 0, profitUSD: 0 };

      let lotSize = riskAmountUSD / (slDistance * contractSize);
      lotSize = Math.max(0.01, Math.floor(lotSize * 100) / 100);

      const profitUSD = lotSize * tpDistance * contractSize;

      document.getElementById('resLot').textContent = lotSize.toFixed(2) + " Lot";
      document.getElementById('resRiskUSD').textContent = "-$" + riskAmountUSD.toFixed(2);
      document.getElementById('resRewardUSD').textContent = "+$" + profitUSD.toFixed(2);

      return { lotSize, riskAmountUSD, profitUSD, entry, sl, tp };
    }

    function saveToJournal() {
      const calc = calculateRisk();
      if (calc.lotSize === 0) return;

      const item = {
        dir: currentDirection,
        entry: calc.entry,
        sl: calc.sl,
        tp: calc.tp,
        lot: calc.lotSize,
        risk: calc.riskAmountUSD.toFixed(2),
        reward: calc.profitUSD.toFixed(2)
      };

      journalData.push(item);
      renderJournal();
    }

    function renderJournal() {
      const tbody = document.getElementById('journalBody');
      tbody.innerHTML = '';
      journalData.slice().reverse().forEach(item => {
        const tr = document.createElement('tr');
        const dirColor = item.dir === 'BUY' ? 'var(--green-profit)' : 'var(--red-loss)';
        tr.innerHTML = `
          <td style="color:${dirColor}; font-weight:600;">${item.dir}</td>
          <td>${item.entry}</td>
          <td><span style="color:var(--red-loss)">${item.sl}</span> / <span style="color:var(--green-profit)">${item.tp}</span></td>
          <td><b>${item.lot}</b></td>
          <td>-$${item.risk} / +$${item.reward}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportCSV() {
      if (journalData.length === 0) return alert('Jurnal masih kosong!');
      let csv = 'Posisi,Entry,SL,TP,Lot,Risk USD,Reward USD\n';
      journalData.forEach(r => {
        csv += `${r.dir},${r.entry},${r.sl},${r.tp},${r.lot},-${r.risk},+${r.reward}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'Trading_Journal_Rafliansyah.csv');
      a.click();
    }

    function adjustContractSize() {
      const asset = document.getElementById('asset').value;
      if (asset === "100") {
        document.getElementById('entry').value = "2650.00"; document.getElementById('sl').value = "2645.00"; document.getElementById('tp').value = "2665.00";
      } else if (asset === "20") {
        document.getElementById('entry').value = "19800.0"; document.getElementById('sl').value = "19750.0"; document.getElementById('tp').value = "19950.0";
      } else if (asset === "100000") {
        document.getElementById('entry').value = "1.08500"; document.getElementById('sl').value = "1.08200"; document.getElementById('tp').value = "1.09400";
      }
      calculateRisk();
    }

    calculateRisk();
  </script>

</body>
</html>
