<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Risk Calculator Pro - Rafliansyah</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #151c28;
      --card-border: #232d3f;
      --input-bg: #1c2536;
      --input-border: #2e3a50;
      --accent: #3b82f6;
      --green-profit: #10b981;
      --red-loss: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .calc-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .author-tag { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
    h2 { font-size: 1.4rem; font-weight: 600; color: var(--text-main); }

    /* Direction Switcher (Buy/Sell) */
    .type-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
    }

    .type-btn {
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .type-btn.active-buy { background: var(--green-profit); color: #fff; }
    .type-btn.active-sell { background: var(--red-loss); color: #fff; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }

    input, select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; padding: 12px 14px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: 0.2s;
    }

    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    select option { background: var(--card-bg); color: var(--text-main); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Risk Status Badge */
    .risk-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: 600;
    }
    .risk-safe { background: rgba(16, 185, 129, 0.15); color: var(--green-profit); }
    .risk-high { background: rgba(244, 63, 94, 0.15); color: var(--red-loss); }

    .btn-calc {
      width: 100%; margin-top: 8px; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: #ffffff; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
    }
    .btn-calc:hover { background: #2563eb; }

    /* Visual Bar R:R */
    .rr-bar-container {
      height: 6px; width: 100%; background: var(--input-border);
      border-radius: 3px; overflow: hidden; margin-top: 8px; display: flex;
    }
    .rr-bar-loss { height: 100%; background: var(--red-loss); }
    .rr-bar-profit { height: 100%; background: var(--green-profit); }

    .results-box {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--card-border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }

    .res-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; text-align: center; }
    .res-card.full-width { grid-column: span 2; }
    .res-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
    .res-val { font-size: 1.25rem; font-weight: 600; margin-top: 4px; }
    .val-accent { color: var(--accent); }
    .val-green { color: var(--green-profit); }
    .val-red { color: var(--red-loss); }

    .footer-note { text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 20px; }
  </style>
</head>
<body>

  <div class="calc-container">
    <div class="header">
      <div class="author-tag">Rafliansyah</div>
      <h2>Trading Risk Calculator</h2>
    </div>

    <!-- Direction Switcher -->
    <div class="type-switcher">
      <button class="type-btn active-buy" id="btnBuy" onclick="setDirection('BUY')">LONG (BUY)</button>
      <button class="type-btn" id="btnSell" onclick="setDirection('SELL')">SHORT (SELL)</button>
    </div>

    <div class="form-group">
      <label>Instrumen Pasar</label>
      <select id="asset" onchange="adjustContractSize()">
        <option value="100">XAUUSD (Spot Gold - 100 oz)</option>
        <option value="20">US100 / Nasdaq (Index - $20)</option>
        <option value="100000">EURUSD / GBPUSD (Forex Standard - 100k)</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Modal ($)</label>
        <input type="number" id="balance" value="1000" oninput="calculateRisk()">
      </div>
      <div class="form-group">
        <label>Risiko (%) <span id="riskBadge" class="risk-badge risk-safe">SAFE</span></label>
        <input type="number" id="riskPercent" value="1" step="0.1" oninput="calculateRisk()">
      </div>
    </div>

    <div class="form-group">
      <label>Harga Entry</label>
      <input type="number" id="entry" value="2650.00" step="any" oninput="calculateRisk()">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Stop Loss (SL)</label>
        <input type="number" id="sl" value="2645.00" step="any" oninput="calculateRisk()">
      </div>
      <div class="form-group">
        <label>Take Profit (TP)</label>
        <input type="number" id="tp" value="2665.00" step="any" oninput="calculateRisk()">
      </div>
    </div>

    <!-- Hasil kalkulasi -->
    <div class="results-box">
      <div class="res-card full-width">
        <div class="res-label">Rekomendasi Lot Size</div>
        <div class="res-val val-accent" id="resLot">0.00 Lot</div>
      </div>
      <div class="res-card">
        <div class="res-label">Risiko Maksimal</div>
        <div class="res-val val-red" id="resRiskUSD">-$0.00</div>
      </div>
      <div class="res-card">
        <div class="res-label">Estimasi Profit</div>
        <div class="res-val val-green" id="resRewardUSD">+$0.00</div>
      </div>
      <div class="res-card full-width">
        <div class="res-label">Rasio Risk to Reward (R:R)</div>
        <div class="res-val" id="resRR">1 : 0.00</div>
        <!-- Bar visual rasio R:R -->
        <div class="rr-bar-container">
          <div class="rr-bar-loss" id="barLoss" style="width: 50%;"></div>
          <div class="rr-bar-profit" id="barProfit" style="width: 50%;"></div>
        </div>
      </div>
    </div>

    <div class="footer-note">Risk Management System &bull; 2026</div>
  </div>

  <script>
    let currentDirection = 'BUY';

    function setDirection(dir) {
      currentDirection = dir;
      const btnBuy = document.getElementById('btnBuy');
      const btnSell = document.getElementById('btnSell');

      if (dir === 'BUY') {
        btnBuy.className = 'type-btn active-buy';
        btnSell.className = 'type-btn';
      } else {
        btnSell.className = 'type-btn active-sell';
        btnBuy.className = 'type-btn';
      }
      calculateRisk();
    }

    function calculateRisk() {
      const balance = parseFloat(document.getElementById('balance').value);
      const riskPercent = parseFloat(document.getElementById('riskPercent').value);
      const entry = parseFloat(document.getElementById('entry').value);
      const sl = parseFloat(document.getElementById('sl').value);
      const tp = parseFloat(document.getElementById('tp').value);
      const contractSize = parseFloat(document.getElementById('asset').value);

      // Warning Indicator Risiko
      const riskBadge = document.getElementById('riskBadge');
      if (riskPercent > 2) {
        riskBadge.textContent = 'HIGH RISK';
        riskBadge.className = 'risk-badge risk-high';
      } else {
        riskBadge.textContent = 'SAFE';
        riskBadge.className = 'risk-badge risk-safe';
      }

      if (isNaN(balance) || isNaN(riskPercent) || isNaN(entry) || isNaN(sl) || isNaN(tp)) return;

      const riskAmountUSD = balance * (riskPercent / 100);
      const slDistance = Math.abs(entry - sl);
      const tpDistance = Math.abs(entry - tp);

      if (slDistance === 0) return;

      let lotSize = riskAmountUSD / (slDistance * contractSize);
      lotSize = Math.max(0.01, Math.floor(lotSize * 100) / 100);

      const profitUSD = lotSize * tpDistance * contractSize;
      const rrRatio = (tpDistance / slDistance);

      document.getElementById('resLot').textContent = lotSize.toFixed(2) + " Lot";
      document.getElementById('resRiskUSD').textContent = "-$" + riskAmountUSD.toFixed(2);
      document.getElementById('resRewardUSD').textContent = "+$" + profitUSD.toFixed(2);
      document.getElementById('resRR').textContent = "1 : " + rrRatio.toFixed(2);

      // Bar Visual R:R
      const totalRatio = 1 + rrRatio;
      const lossPercent = (1 / totalRatio) * 100;
      const profitPercent = (rrRatio / totalRatio) * 100;
      document.getElementById('barLoss').style.width = lossPercent + "%";
      document.getElementById('barProfit').style.width = profitPercent + "%";
    }

    function adjustContractSize() {
      const asset = document.getElementById('asset').value;
      const entryEl = document.getElementById('entry');
      const slEl = document.getElementById('sl');
      const tpEl = document.getElementById('tp');

      if (asset === "100") {
        entryEl.value = "2650.00"; slEl.value = "2645.00"; tpEl.value = "2665.00";
      } else if (asset === "20") {
        entryEl.value = "19800.0"; slEl.value = "19750.0"; tpEl.value = "19950.0";
      } else if (asset === "100000") {
        entryEl.value = "1.08500"; slEl.value = "1.08200"; tpEl.value = "1.09400";
      }
      calculateRisk();
    }

    calculateRisk();
  </script>

</body>
</html>
